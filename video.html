<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hoppoulegionfiles.org</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #e34c3e;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #000;
    }
    .message, .video-section {
      min-height: 100vh;
    }
    .message {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .message p {
      color: var(--message-color);
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 400;
      line-height: 1.5;
    }
    .video-section {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .wrap {
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <section class="message" aria-label="Message">
      <p id="message"></p>
    </section>
    <section class="video-section" aria-label="Video">
      <div class="wrap" id="player"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      var cfg = window.SITE_CONFIG || {};
      var key = cfg.unlockKey || "hoppou_unlocked";
      var unlocked = false;
      try {
        unlocked = sessionStorage.getItem(key) === "1";
      } catch (err) {}
      if (!unlocked) {
        window.location.replace("index.html");
        return;
      }

      var message = document.getElementById("message");
      message.textContent = cfg.message || "";
      message.style.setProperty("--message-color", cfg.messageColor || "#e34c3e");

      var id = cfg.youtubeId || "";
      var player = document.getElementById("player");
      var iframe = document.createElement("iframe");
      iframe.src = "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?rel=0";
      iframe.title = "Video";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      player.appendChild(iframe);
    })();
  </script>
</body>
</html>
